[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 20000
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 512

[fmt]
# deployed and verified on Sourcify byte for byte, or pinned to a CREATE2 address the app ships: keep the source
# exactly as compiled (SafetySim's bytecode is embedded in web/lib/safetySimCode.ts)
ignore = ["src/StoaBuyback.sol", "src/StoaLimit.sol", "src/tools/SafetySim.sol"]

[invariant]
runs = 64
depth = 128
fail_on_revert = false
