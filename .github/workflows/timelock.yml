name: Put the admin Safe behind a 48h timelock

# One-time. Deploys OpenZeppelin's TimelockController (proposer, executor and canceller: the admin Safe; no admin
# role), then one Safe transaction (deployer approves, owner executes) hands the five owned contracts to the
# timelock, accepts them through it, raises the maker unbonding delay to 3 days (longer than the timelock, so a maker
# cannot leave before a slash lands) and finally sets the timelock delay to 48 hours. Needs OWNER_PRIVATE_KEY for
# this run only: delete that secret afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  timelock:
    runs-on: ubuntu-latest
    environment: signers # the Safe signer keys live here, usable from main only
    env:
      RPC: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
      OWNER_PK: ${{ secrets.OWNER_PRIVATE_KEY }}
      DEP_PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      MULTISEND: "0x40A2aCCbd92BCA938b02010E17A5b8929b49130D"
      DELAY: "172800"        # 48 hours
      UNBOND: "259200"       # 3 days
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy timelock and hand over ownership
        working-directory: contracts
        run: bash script/timelock.sh
      - name: Save
        run: |
          git diff --quiet web/lib/deployments.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
          git add web/lib/deployments.json
          git commit -m "deploy: 48h timelock between the admin Safe and the contracts"
          git push
