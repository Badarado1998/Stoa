name: Deploy Pons curve adapter (Robinhood Chain)

# Manual only. Unticked "broadcast" = dry run against Robinhood Chain mainnet: sends nothing.
# Deploys PonsCurveAdapter (trades tokens still on their Pons bonding curve, $STOA included) for the live router and
# publishes its address to web/lib/deployments-4663.json. The adapter has no owner. It is not used until the admin
# Safe adds it to the router through the 48h timelock; the hourly "Robinhood governance steps" workflow runs those
# three Safe steps. Pays gas from ROBINHOOD_DEPLOYER_PRIVATE_KEY (well under 0.001 ETH).
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Send the transaction (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-robinhood
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Check settings
        run: |
          test -n "$PK" || { echo "::error::secret ROBINHOOD_DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          test -z "$(jq -r '.ponsAdapter // empty' ../web/lib/deployments-4663.json)" || { echo "::error::already deployed (see web/lib/deployments-4663.json)"; exit 1; }
          [ "$(cast chain-id --rpc-url "$ROBINHOOD_RPC_URL")" = "4663" ] || { echo "::error::RPC is not Robinhood Chain mainnet"; exit 1; }
          ME=$(cast wallet address --private-key "$PK")
          echo "Deployer: $ME"
          echo "Balance:  $(cast balance $ME --ether --rpc-url "$ROBINHOOD_RPC_URL") ETH"
          cp ../web/lib/deployments-4663.json deployments/4663.json

      - name: Unit tests
        run: forge test --no-match-contract Fork

      - name: Fork tests - exact quotes on live Pons curves, live router routes ETH and USDG to $STOA
        run: forge test --match-contract ForkRobinhoodPons -vv

      - name: Deploy (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        run: |
          forge script script/DeployPonsRobinhood.s.sol --rpc-url "$ROBINHOOD_RPC_URL" --private-key "$PK" \
            --slow ${{ inputs.broadcast && '--broadcast' || '' }}
          cat deployments/4663-pons.json

      - name: Verify on Sourcify
        if: ${{ inputs.broadcast }}
        continue-on-error: true
        run: |
          P=$(jq -r .ponsAdapter deployments/4663-pons.json)
          forge verify-contract $P src/adapters/PonsCurveAdapter.sol:PonsCurveAdapter --verifier sourcify --chain 4663 \
            --constructor-args $(cast abi-encode "c(address,address,address)" 0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e 0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73 0x2F2804fad735a38015650f32f95Ad5E08D6B3eE5) || true

      - name: Publish the address to the web app
        if: ${{ inputs.broadcast }}
        working-directory: .
        run: |
          jq -s '.[0] * .[1]' web/lib/deployments-4663.json contracts/deployments/4663-pons.json > /tmp/d.json
          mv /tmp/d.json web/lib/deployments-4663.json
          cat web/lib/deployments-4663.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
          git add web/lib/deployments-4663.json
          git commit -m "deploy: Pons curve adapter on Robinhood Chain (not routed until the Safe adds it)"
          git pull --rebase && git push
