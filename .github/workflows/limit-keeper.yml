name: Limit order keeper (Robinhood Chain)

# Every 5 minutes (each hourly run loops; see below): fills every open limit order whose minimum the router can pay now,
# along the router's own best route, and returns the deposits of expired orders to their makers. Does nothing until
# StoaLimit is deployed and the web app ships its address.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Only print what it would do"
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: limit-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    defaults:
      run:
        working-directory: contracts
    env:
      RPC: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
      DRY: ${{ inputs.dry && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
      - name: Fill and expire limit orders
        run: |
          set -o pipefail
          test -n "$PK" || { echo "::error::secret ROBINHOOD_DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          # GitHub starts scheduled runs about once an hour, not every 5 minutes, so each run checks every 5 minutes
          # for about 55 minutes (a manual run checks once). The concurrency group keeps one run at a time.
          passes=$([ "${{ github.event_name }}" = schedule ] && echo 11 || echo 1)
          for i in $(seq 1 $passes); do
            echo "pass $i ($(date -u +%H:%M) UTC)" | tee -a /tmp/out.txt
            bash script/limit.sh 2>&1 | tee -a /tmp/out.txt || echo "pass $i failed; retrying in 5 minutes" | tee -a /tmp/out.txt
            [ "$i" -lt "$passes" ] && sleep 290
          done
          grep -vE '^(logs|status|transactionHash) ' /tmp/out.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
