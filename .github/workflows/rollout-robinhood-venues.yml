name: Robinhood governance steps (Safe rounds)

# Runs every hour until everything is done, then disables itself. Each run moves each pending governance action one
# step forward if that step is due, otherwise it only logs when the next step opens:
# - Aero + Ramses (script/RolloutVenuesRobinhood.s.sol): 1) schedule in the 48h timelock, 2) propose on the router,
#   3) add both adapters once the router's 1-day wait has passed
# - $STOA buyback (script/RolloutBuybackRobinhood.s.sol): 1) schedule, 2) hand the FeeDistributor to StoaBuyback
# - Pons curves (script/RolloutPonsRobinhood.s.sol, once deployed): same three steps as Aero + Ramses
# - Metric (script/RolloutMetricRobinhood.s.sol, once deploy-robinhood-metric.yml ran): same three steps
# - up.: its original adapter 0xB408 is not added (script/CancelUpRobinhood.s.sol cancels the two timelock operations
#   scheduled for it); up. goes in with the adapter update below
# - V4 adapter swap (script/RolloutV4FixRobinhood.s.sol, once deploy-robinhood-fixes.yml ran): adds UniswapV4AdapterV2
#   and removes the old V4 adapter in the same final step
# - UniswapV4AdapterV3 (script/RolloutV4AdapterV3Robinhood.s.sol, once deploy-robinhood-v4v3.yml ran; starts after the
#   V4 adapter swap is DONE): schedules the router change and one timelock operation per pin, executes each pin once its
#   key is registered, then adds V3 and removes UniswapV4AdapterV2 in the same final step
# - Gas-capped adapters (script/RolloutSimGasRobinhood.s.sol, once deploy-robinhood-simgas.yml ran): adds
#   UniswapV3AdapterV2 and CLTickSpacingAdapterV2 for Aero, Ramses and up., and removes the old V3, Aero and Ramses
#   adapters in the same final step
# - QHooks hooks on V3's allowlist (script/AllowHooksRobinhood.s.sol): 1) schedule, 2) allow each hook once ready
# Signs as two Safe signers from OWNER_PRIVATE_KEY (0x5A63...03c9) and DEPLOYER_PRIVATE_KEY (0x0568...c500). With only
# one of them set it approves and the other signer can press the same step on stoadex.com/admin (Robinhood).
# Delete OWNER_PRIVATE_KEY once the run summary says every step is done.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: rollout-robinhood-venues
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    environment: signers # the Safe signer keys live here, usable from main only
    defaults:
      run:
        working-directory: contracts
    env:
      RPC: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      K1: ${{ secrets.OWNER_PRIVATE_KEY }}
      K2: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Next step (if due)
        run: |
          set -o pipefail
          [ "$(cast chain-id --rpc-url "$RPC")" = "4663" ] || { echo "::error::RPC is not Robinhood Chain"; exit 1; }
          cp ../web/lib/deployments-4663.json deployments/4663.json
          # keys may be saved with or without 0x
          [ -n "$K1" ] && export SIGNER1_PK="0x${K1#0x}"
          [ -n "$K2" ] && export SIGNER2_PK="0x${K2#0x}"
          echo "OWNER_PRIVATE_KEY: $([ -n "$K1" ] && echo set || echo missing) · DEPLOYER_PRIVATE_KEY: $([ -n "$K2" ] && echo set || echo missing)"
          if [ -z "$K1$K2" ]; then
            echo "::notice::No signer key yet: add OWNER_PRIVATE_KEY and DEPLOYER_PRIVATE_KEY in the repository secrets."
            echo "No signer key yet." > /tmp/out.txt; exit 0
          fi
          forge script script/RolloutVenuesRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee /tmp/out.txt
          want=1
          if [ -n "$(jq -r '.stoaBuyback // empty' deployments/4663.json)" ]; then
            forge script script/RolloutBuybackRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          if [ -n "$(jq -r '.ponsAdapter // empty' deployments/4663.json)" ]; then
            forge script script/RolloutPonsRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          if [ -f deployments/4663-metric.json ]; then  # committed by deploy-robinhood-metric.yml
            forge script script/RolloutMetricRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          # up. goes into the router with the adapter update (RolloutSimGasRobinhood). Its original adapter
          # (0xB408, deployments/4663-up.json) is not added: cancel the two timelock operations that were scheduled for
          # it (script/CancelUpRobinhood.s.sol; logs DONE once neither is pending).
          forge script script/CancelUpRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
          want=$((want + 1))
          if [ -f deployments/4663-fixes.json ]; then  # committed by deploy-robinhood-fixes.yml
            forge script script/RolloutV4FixRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          if [ -f deployments/4663-v4v3.json ]; then  # committed by deploy-robinhood-v4v3.yml
            forge script script/RolloutV4AdapterV3Robinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
            # QHooks launch hooks on V3's allowlist (script/AllowHooksRobinhood.s.sol): schedule, then allow each
            forge script script/AllowHooksRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          if [ -f deployments/4663-simgas.json ]; then  # committed by deploy-robinhood-simgas.yml
            forge script script/RolloutSimGasRobinhood.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee -a /tmp/out.txt
            want=$((want + 1))
          fi
          echo "$want" > /tmp/want.txt
          grep -E "WAIT|APPROVED|EXECUTED|DONE" /tmp/out.txt | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop the hourly runs once done
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(grep -c "DONE:" /tmp/out.txt)" -ge "$(cat /tmp/want.txt 2>/dev/null || echo 99)" ]; then
            echo "Every pending step is done. Delete the OWNER_PRIVATE_KEY and DEPLOYER_PRIVATE_KEY secrets." >> "$GITHUB_STEP_SUMMARY"
            gh workflow disable rollout-robinhood-venues.yml -R "$GITHUB_REPOSITORY"
          fi
