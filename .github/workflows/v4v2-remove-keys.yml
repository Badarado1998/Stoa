name: Remove reviewed V4 keys (UniswapV4AdapterV2, Robinhood Chain)

# Manual. The keeper unregisters the pool keys listed in the JSON file given as input (default: the 19 dead keys found by
# the gas report on 17 Nov 2026: hook-less, tick spacing 1, unable to fill even 0.01 ETH / 30 USDG, each costing 22M to
# 27M gas on every quote of its pair). Their pool ids are already in contracts/script/data/v4v2-reviewed.json, so
# v4-guard stays green. A key no longer listed is skipped; the $STOA pool and ETH/USDG are refused outright.
# Removing a key only reduces routing.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "JSON list of keys under contracts/script/data/"
        default: v4v2-remove-dead-2026-11-17.json

permissions:
  contents: read

concurrency:
  group: v4v2-keys
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      RPC: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      V2: "0x27958279F95225b2a5517E7DD12b6Fc0317E5c5d"
      LIST: script/data/${{ inputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
      - name: Unregister
        env:
          PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
        run: |
          test -n "$PK" || { echo "::error::ROBINHOOD_DEPLOYER_PRIVATE_KEY missing"; exit 1; }
          case "${{ inputs.list }}" in *[!A-Za-z0-9._-]*|"") echo "::error::bad file name"; exit 1;; esac
          test -f "$LIST" || { echo "::error::$LIST not found"; exit 1; }
          K="keysFor(address,address)((address,address,uint24,int24,address)[])"
          WETH=0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73
          USDG=0x5fc5360d0400a0fd4f2af552add042d716f1d168
          STOA=0x13e6993417616de724f2b337d65063f229e96718
          canon() { if [ "$1" = "0x0000000000000000000000000000000000000000" ]; then echo $WETH; else echo $1; fi; }
          done_n=0; gone=0
          while read -r c0 c1 fee ts hooks pid; do
            k="($c0,$c1,$fee,$ts,$hooks)"
            l="$(echo "$c0 $c1" | tr 'A-F' 'a-f')"
            case "$l" in *${STOA#0x}*) echo "::error::refusing a STOA key $k"; exit 1;; esac
            if echo "$l" | grep -q "^0x0000000000000000000000000000000000000000 ${USDG}$"; then echo "::error::refusing ETH/USDG $k"; exit 1; fi
            grep -qi "$pid" script/data/v4v2-reviewed.json || { echo "::error::$pid is not in v4v2-reviewed.json"; exit 1; }
            keys=$(cast call $V2 "$K" "$(canon $c0)" "$(canon $c1)" --rpc-url "$RPC" | tr 'A-F' 'a-f')
            echo "$keys" | grep -q "$(echo "$c0, $c1, $fee, $ts, $hooks" | tr 'A-F' 'a-f')" || { echo "not listed any more: $k"; gone=$((gone+1)); continue; }
            tx=$(cast send $V2 "unregister((address,address,uint24,int24,address))" "$k" --private-key "$PK" --rpc-url "$RPC" --json | jq -r '.transactionHash + " " + .status')
            echo "unregistered $k: $tx"
            done_n=$((done_n+1))
          done < <(jq -r '.[] | "\(.currency0) \(.currency1) \(.fee) \(.tickSpacing) \(.hooks) \(.poolId)"' "$LIST")
          echo "removed $done_n keys, $gone were already gone" | tee -a "$GITHUB_STEP_SUMMARY"
