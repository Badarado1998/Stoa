name: Mirror to Twigpine

# Mirrors this repository to Twigpine (decentralized git: every push is signed with an Ed25519 DID key and gets a
# certificate) on every push to main, so the code can be checked outside GitHub. The identity comes from one repository
# secret: TWIGPINE_SEED (any long random text; the Ed25519 key is SHA-256 of it, so the same text always gives the same
# DID) or TWIGPINE_IDENTITY_PEM (an identity.pem from `gl identity new`). Without either, the seed is the existing
# HF_TOKEN secret (one-way SHA-256, so the key reveals nothing about the token; rotating HF_TOKEN changes the DID unless
# TWIGPINE_SEED is set). The key is made in its own step and the Twigpine CLI runs without any secret in its environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twigpine-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.TWIGPINE_SEED != '' || secrets.TWIGPINE_IDENTITY_PEM != '' || secrets.HF_TOKEN != '' }}
      GITLAWB_NODE: https://node.twigpine.com
      TWIGPINE_NODE: https://node.twigpine.com
      REPO_NAME: stoa
    steps:
      - name: Skip without the key
        if: env.HAS_KEY != 'true'
        run: echo "No identity secret; nothing mirrored."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: "22"
      - name: Install the Twigpine CLI
        if: env.HAS_KEY == 'true'
        run: npm install -g @gitlawb/gl@0.8.1
      - name: Make the signing key
        if: env.HAS_KEY == 'true'
        env:
          SEED: ${{ secrets.TWIGPINE_SEED || secrets.HF_TOKEN }}
          PEM: ${{ secrets.TWIGPINE_IDENTITY_PEM }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tp"
          if [ -n "$PEM" ]; then
            printf '%s\n' "$PEM" > "$RUNNER_TEMP/tp/identity.pem"
          else
            python3 -c "import cryptography" 2>/dev/null || pip install --quiet --break-system-packages cryptography
            python3 -c 'import hashlib,os,sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K
          from cryptography.hazmat.primitives import serialization as s
          seed=os.environ["SEED"].strip().encode()
          if len(seed)<32: sys.exit("TWIGPINE_SEED must be at least 32 characters")
          k=K.from_private_bytes(hashlib.sha256(b"stoa-twigpine-v1:"+seed).digest())
          open(sys.argv[1],"wb").write(k.private_bytes(s.Encoding.PEM,s.PrivateFormat.PKCS8,s.NoEncryption()))' "$RUNNER_TEMP/tp/identity.pem"
          fi
      - name: Mirror
        if: env.HAS_KEY == 'true'
        run: |
          export GITLAWB_KEY="$RUNNER_TEMP/tp/identity.pem" TWIGPINE_KEY="$RUNNER_TEMP/tp/identity.pem"
          # each step's output goes to the log; on failure its last lines also become an annotation (no secrets in it)
          run() { local name="$1"; shift; if ! "$@" >"$RUNNER_TEMP/out.txt" 2>&1; then cat "$RUNNER_TEMP/out.txt"; echo "::error title=$name failed::$(grep -v '^ *[0-9]*: <unknown>' "$RUNNER_TEMP/out.txt" | tail -8 | tr '\n' ' ' | cut -c1-900)"; return 1; fi; cat "$RUNNER_TEMP/out.txt"; }
          DID=$(gl identity show)
          echo "identity: $DID"
          # the identity is registered once; the node rate-limits registering again, so push first and
          # register only when a push is refused
          gl repo create "$REPO_NAME" --description "Stoa: swap router on Robinhood Chain and Elysium. Mirror of github.com/StoaDex/Stoa, every push signed. stoadex.com" >/dev/null 2>&1 || echo "repo exists"
          git config user.name "$DID"
          git config user.email "$DID@gitlawb"
          git remote add twigpine "gitlawb://$DID/$REPO_NAME"
          if ! git push twigpine HEAD:refs/heads/main --force >"$RUNNER_TEMP/p1.txt" 2>&1; then
            grep -v '<unknown>' "$RUNNER_TEMP/p1.txt" | tail -5
            gl register >/dev/null 2>&1 || echo "register: not needed or rate-limited"
            run push git push twigpine HEAD:refs/heads/main --force
          else
            cat "$RUNNER_TEMP/p1.txt"
          fi
          git push twigpine --tags --force >/dev/null 2>&1 || true
          echo "mirrored: https://explorer.twigpine.com/repos/${DID#did:key:}/$REPO_NAME"
          rm -rf "$RUNNER_TEMP/tp"
