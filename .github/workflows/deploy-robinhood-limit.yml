name: Deploy limit orders (Robinhood Chain)

# Manual only. Unticked "broadcast" = dry run against Robinhood Chain mainnet: sends nothing.
# Deploys StoaLimit (limit orders filled through the router; makers can always cancel), owned by the 48h timelock from
# the constructor, with CREATE2 through the standard deterministic deployer. Once the web app ships the address
# (web/lib/deployments-4663.json `limit`), the script refuses any other address. Verifies on Sourcify.
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Send the transaction (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-robinhood
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
    steps:
      # The CREATE2 address depends on the exact bytecode, metadata hash included. The metadata lists every remapping
      # forge passes to solc, and forge adds one for each nested submodule it finds (OpenZeppelin's own erc4626-tests,
      # halmos-cheatcodes, ds-test). So check out the top-level submodules only, as the address was computed with,
      # and pin Foundry to that version too.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check settings
        run: |
          test -n "$PK" || { echo "::error::secret ROBINHOOD_DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          R=$(jq -r '.limit // empty' ../web/lib/deployments-4663.json)
          if [ -n "$R" ] && [ "$(cast code $R --rpc-url "$ROBINHOOD_RPC_URL")" != "0x" ]; then echo "::error::already deployed at $R"; exit 1; fi
          [ "$(cast chain-id --rpc-url "$ROBINHOOD_RPC_URL")" = "4663" ] || { echo "::error::RPC is not Robinhood Chain mainnet"; exit 1; }
          echo "Deployer: $(cast wallet address --private-key "$PK") · $(cast balance $(cast wallet address --private-key "$PK") --ether --rpc-url "$ROBINHOOD_RPC_URL") ETH"
          cp ../web/lib/deployments-4663.json deployments/4663.json

      - name: Unit, attack and fuzz tests
        run: forge test --match-contract StoaLimitTest

      - name: Fork test - live router, buy and sell orders
        run: forge test --match-contract ForkRobinhoodLimit -vv

      - name: Deploy (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        run: |
          forge script script/DeployLimitRobinhood.s.sol --rpc-url "$ROBINHOOD_RPC_URL" --private-key "$PK" \
            --slow ${{ inputs.broadcast && '--broadcast' || '' }}
          cat deployments/4663-limit.json

      - name: Verify on Sourcify
        if: ${{ inputs.broadcast }}
        continue-on-error: true
        run: |
          R=$(jq -r .limit deployments/4663-limit.json)
          ARGS=$(cast abi-encode "c(address,address,address,address)" \
            0xAC75133729d6B5d615aA696d0828dC31fcB83ed8 0x2F2804fad735a38015650f32f95Ad5E08D6B3eE5 \
            0x5A63C75B38e7ee42220Cc3A57702E06D1D8903c9 0xbf666e8D054935170b9f09127247905A975b3B80)
          forge verify-contract $R src/StoaLimit.sol:StoaLimit --verifier sourcify --chain 4663 --constructor-args $ARGS || true

      - name: Check the deployed contract
        if: ${{ inputs.broadcast }}
        run: |
          cat deployments/4663-limit.json
          R=$(jq -r .limit deployments/4663-limit.json)
          echo "owner $(cast call $R 'owner()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "guardian $(cast call $R 'guardian()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "keeper $(cast call $R 'keeper()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "router $(cast call $R 'router()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "::notice::StoaLimit deployed at $R"
