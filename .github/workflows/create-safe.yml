name: Create Safe

# One-time: deploy Stoa's admin Safe (Safe v1.3.0 contracts already on Elysium) from the deployer wallet, with the
# owner, deployer and treasury wallets as signers and 2 of 3 signatures required. Writes its address to
# web/lib/deployments.json as "safe". Ownership of the Stoa contracts is moved to it from /admin afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    environment: signers # the Safe signer keys live here, usable from main only
    env:
      RPC: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
      PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      FACTORY: "0xa6B71E26C5e0845f74c812102Ca7114b6a896AB2"
      SINGLETON_L2: "0x3E5c63644E683549055b9Be8653de26E0B4CD36E"
      FALLBACK: "0xf48f2B2d2a534e402487b3ee7C18c33Aec0Fe5e4"
      SIGNERS: "0x5A63C75B38e7ee42220Cc3A57702E06D1D8903c9,0x056896d7d62fB4faE30f53d76CB55264f4c5c500,0xDF129a523aEb072a2CEcbA50170eAb2fcB183C4c"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
      - name: Deploy the Safe
        run: |
          set -euo pipefail
          test -z "$(jq -r '.safe // empty' web/lib/deployments.json)" || { echo "Safe already recorded"; exit 1; }
          Z=0x0000000000000000000000000000000000000000
          INIT=$(cast calldata 'setup(address[],uint256,address,bytes,address,address,uint256,address)' "[$SIGNERS]" 2 $Z 0x $FALLBACK $Z 0 $Z)
          SALT=$(cast keccak "stoa-admin-safe")
          OUT=$(cast send $FACTORY 'createProxyWithNonce(address,bytes,uint256)' $SINGLETON_L2 $INIT $SALT --private-key "$PK" --rpc-url $RPC --json)
          echo "$OUT" | jq -r '.status, .transactionHash'
          # ProxyCreation(address proxy, address singleton): proxy is the first 32-byte word of the factory's log data
          SAFE=$(echo "$OUT" | jq -r --arg f "${FACTORY,,}" '.logs[] | select((.address|ascii_downcase)==$f) | .data' | head -1 | cut -c27-66)
          SAFE=$(cast to-check-sum-address 0x$SAFE)
          echo "Safe: $SAFE"
          echo "owners: $(cast call $SAFE 'getOwners()(address[])' --rpc-url $RPC)  threshold: $(cast call $SAFE 'getThreshold()(uint256)' --rpc-url $RPC)"
          jq --arg s "$SAFE" '.safe = $s' web/lib/deployments.json > /tmp/d.json && mv /tmp/d.json web/lib/deployments.json
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
          git add web/lib/deployments.json
          git commit -m "deploy: admin Safe (2 of 3)"
          git push
