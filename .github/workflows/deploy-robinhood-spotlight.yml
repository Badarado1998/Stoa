name: Deploy Spotlight Market (Robinhood Chain)

# Manual only. Unticked "broadcast" = dry run against Robinhood Chain mainnet: sends nothing.
# Deploys SpotlightMarket (weekly sponsored slots paid in ETH to $STOA holders), owned by the 48h timelock from the
# constructor, with CREATE2 at the address the web app already ships (web/lib/deployments-4663.json `spotlightMarket`;
# the script refuses any other address), and verifies it on Sourcify.
# Week 0 starts Monday 23 November 2026, 07:00 WIB; the deploy must happen before that.
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Send the transaction (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-robinhood
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
    steps:
      # The CREATE2 address the app ships depends on the exact bytecode, metadata hash included. The metadata lists every
      # remapping forge passes to solc, and forge adds one for each nested submodule it finds (OpenZeppelin's own
      # erc4626-tests, halmos-cheatcodes, ds-test). So check out the top-level submodules only, as the address was
      # computed with, and pin Foundry to that version too.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check settings
        run: |
          test -n "$PK" || { echo "::error::secret ROBINHOOD_DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          M=$(jq -r '.spotlightMarket // empty' ../web/lib/deployments-4663.json)
          if [ -n "$M" ] && [ "$(cast code $M --rpc-url "$ROBINHOOD_RPC_URL")" != "0x" ]; then echo "::error::already deployed at $M"; exit 1; fi
          [ "$(cast chain-id --rpc-url "$ROBINHOOD_RPC_URL")" = "4663" ] || { echo "::error::RPC is not Robinhood Chain mainnet"; exit 1; }
          echo "Deployer: $(cast wallet address --private-key "$PK") · $(cast balance $(cast wallet address --private-key "$PK") --ether --rpc-url "$ROBINHOOD_RPC_URL") ETH"
          cp ../web/lib/deployments-4663.json deployments/4663.json

      - name: Unit and attack tests
        run: forge test --no-match-contract Fork

      - name: Fork test - a full week on the live router, real $STOA locked, burn through the V4 pool
        run: forge test --match-contract ForkRobinhoodSpotlight -vv

      - name: Deploy (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        run: |
          forge script script/DeploySpotlightRobinhood.s.sol --rpc-url "$ROBINHOOD_RPC_URL" --private-key "$PK" \
            --slow ${{ inputs.broadcast && '--broadcast' || '' }}
          cat deployments/4663-spotlight.json

      - name: Verify on Sourcify
        if: ${{ inputs.broadcast }}
        continue-on-error: true
        run: |
          M=$(jq -r .spotlightMarket deployments/4663-spotlight.json)
          ARGS=$(cast abi-encode "c(address,address,address,address,address,uint256,(uint8,uint16,uint64,uint64,uint96,uint128))" \
            0xAC75133729d6B5d615aA696d0828dC31fcB83ed8 0x2F2804fad735a38015650f32f95Ad5E08D6B3eE5 \
            0x13E6993417616De724F2b337D65063f229e96718 0x5A63C75B38e7ee42220Cc3A57702E06D1D8903c9 \
            0xbf666e8D054935170b9f09127247905A975b3B80 1795392000 \
            "(3,1000,1000000000000000,10000000000000000,500000000000000000,1000000000000000000000000)")
          forge verify-contract $M src/SpotlightMarket.sol:SpotlightMarket --verifier sourcify --chain 4663 --constructor-args $ARGS || true

      - name: Check the deployed contract
        if: ${{ inputs.broadcast }}
        run: |
          cat deployments/4663-spotlight.json
          M=$(jq -r .spotlightMarket deployments/4663-spotlight.json)
          echo "owner $(cast call $M 'owner()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "start $(cast call $M 'start()(uint256)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "::notice::SpotlightMarket deployed at $M"
