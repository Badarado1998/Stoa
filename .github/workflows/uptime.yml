name: Uptime check

# Every 15 minutes: is stoadex.com up and can the router quote? Checks the home page, Trade, a live router quote
# (0.01 ETH -> USDG on Robinhood Chain), the stock list and the Spotlight API. A check that fails twice, 20 s apart, opens an issue
# labelled "uptime" (GitHub emails the repo owner); while it stays down, one comment an hour; when everything passes
# again, the issue is closed with a note. Each run is also counted in status.json (30 days of daily counts and incidents,
# data/status/record.py), published to the status-data branch on every run, and
# shown on stoadex.com/status. Read-only on-chain: it sends nothing.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write # only to publish status.json on the status-data branch
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/status
          persist-credentials: false
      - name: Restore the status history
        uses: actions/cache/restore@v4
        with:
          path: status.json
          key: uptime-status-${{ github.run_id }}
          restore-keys: uptime-status-
      - name: Check the site and the APIs
        id: run
        run: |
          fail=""
          check() { # name url jq-test
            for i in 1 2; do
              body=$(curl -sS -m 25 -A "stoa-uptime/1" -w '\n%{http_code}' "$2" 2>/dev/null) && code=$(echo "$body" | tail -n1) || code=000
              json=$(echo "$body" | sed '$d')
              if [ "$code" = "200" ] && { [ -z "$3" ] || echo "$json" | jq -e "$3" >/dev/null 2>&1; }; then echo "ok   $1"; printf 'ok\t%s\n' "$1" >> results.txt; return; fi
              sleep 20
            done
            echo "FAIL $1 (HTTP $code)"; fail="$fail\n- $1: HTTP $code, $2"; printf 'fail\t%s\n' "$1" >> results.txt
          }
          check "Home page" "https://stoadex.com/" ""
          check "Trade page" "https://stoadex.com/trade" ""
          check "Router quote 0.01 ETH -> USDG" "https://stoadex.com/api/v1/quote?chain=robinhood&sellToken=native&buyToken=0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168&amount=10000000000000000" '(.amountOut | tonumber) > 0'
          check "Stock tokens API" "https://stoadex.com/api/v1/stocks" '(.stocks | length) > 0'
          check "Spotlight API" "https://stoadex.com/api/v1/spotlight" '.week >= 1'
          printf "%b" "$fail" > fail.txt
      - name: Count this run
        id: rec
        run: python3 -I data/status/record.py results.txt status.json "$GITHUB_OUTPUT"
      - name: Save the status history
        uses: actions/cache/save@v4
        with:
          path: status.json
          key: uptime-status-${{ github.run_id }}
      - name: Publish status.json (every run; the branch holds one commit, replaced each time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d); cd "$d"
          git init -q -b status-data
          mkdir -p web
          cp "$GITHUB_WORKSPACE/status.json" status.json
          # this branch only holds data: no Vercel deployments for it
          printf '{"git":{"deploymentEnabled":{"status-data":false}}}\n' > web/vercel.json
          printf 'Uptime data for stoadex.com/status, written by .github/workflows/uptime.yml. Not code.\n' > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "status $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" status-data:status-data
          echo "published"      - name: Open, update or close the uptime issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --label uptime --json number --jq '.[0].number' -R "${{ github.repository }}")
          if [ -s fail.txt ]; then
            body=$(printf "Checked %s UTC, each twice, 20 s apart:\n%s\n\nRun: %s" "$(date -u '+%Y-%m-%d %H:%M')" "$(cat fail.txt)" "$RUN")
            if [ -z "$n" ]; then
              gh label create uptime --color D73A4A -R "${{ github.repository }}" 2>/dev/null || true
              gh issue create -R "${{ github.repository }}" --title "stoadex.com check failing" --label uptime --body "$body"
            else
              # one comment an hour at most while it stays down
              last=$(gh api "repos/${{ github.repository }}/issues/$n" --jq .updated_at)
              if [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -ge 3300 ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Still failing. $body"; fi
            fi
            exit 1
          elif [ -n "$n" ]; then
            gh issue close "$n" -R "${{ github.repository }}" --comment "All checks pass again ($(date -u '+%Y-%m-%d %H:%M') UTC). $RUN"
          fi
