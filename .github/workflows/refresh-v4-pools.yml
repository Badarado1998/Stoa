name: Refresh Uniswap V4 pools

# Daily: rank the most traded Uniswap V4 launchpad pools on Elysium and register the new ones on Stoa's V4 adapter,
# so fresh tokens route without anyone pressing "Add pool". Known pools and full pairs are skipped at no gas cost.
# Then lists the tokens from the canonical HyperEVM bridge that the router can trade both ways (web token picker).
on:
  schedule:
    - cron: "17 1 * * *" # 08:17 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-v4-pools
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ELYSIUM_RPC_URL: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Rank active pools
        working-directory: contracts/script/data
        run: python3 -I v4_top_pools.py
      - name: Register new pools
        working-directory: contracts
        run: |
          ADAPTER="$(jq -r '.uniswapV4Adapter // empty' ../web/lib/deployments.json)"
          test -n "$ADAPTER" || { echo "no V4 adapter deployed"; exit 0; }
          test -n "${{ secrets.DEPLOYER_PRIVATE_KEY }}" || { echo "::warning::DEPLOYER_PRIVATE_KEY missing; skipping registration"; exit 0; }
          RPC="$ELYSIUM_RPC_URL" PRIVATE_KEY="${{ secrets.DEPLOYER_PRIVATE_KEY }}" ADAPTER="$ADAPTER" ./script/seed-v4.sh
      - name: Robinhood Chain - rank and register new pools
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: |
          test -n "$(jq -r '.uniswapV4Adapter // empty' web/lib/deployments-4663.json)" || { echo "not deployed on Robinhood Chain yet"; exit 0; }
          # the log scan needs the public RPC (keyed plans cap eth_getLogs); registration uses ROBINHOOD_RPC_URL
          # a failed scan (rate limits) still registers the last committed list
          (cd contracts/script/data && ROBINHOOD_RPC_URL=https://rpc.mainnet.chain.robinhood.com CHAIN=robinhood python3 -I v4_top_pools.py) \
            || echo "::warning::Robinhood Chain pool scan failed; registering the last list"
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || { echo "::warning::ROBINHOOD_DEPLOYER_PRIVATE_KEY missing; skipping registration"; exit 0; }
          # the router's V4 adapter, and UniswapV4AdapterV2 (keeper-only registration) until the timelock swaps them
          cd contracts
          for A in $( (jq -r .uniswapV4Adapter ../web/lib/deployments-4663.json; jq -r '.uniswapV4AdapterV2 // empty' deployments/4663-fixes.json 2>/dev/null) | awk 'NF && !seen[tolower($0)]++'); do
            echo "adapter $A"
            # never evicts (full pairs are skipped) and never touches STOA pools or ETH/USDG, the pairs Stoa's own flows use
            # (GHSA-cv5f-wmmh-wcrv)
            RPC="$ROBINHOOD_RPC_URL" PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
              PROTECT="$(jq -r '.stoa // empty' ../web/lib/deployments-4663.json)" \
              PROTECT_PAIRS="0x0000000000000000000000000000000000000000-0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" \
              ADAPTER="$A" SEED=script/data/v4-seed-pools-4663.json ./script/seed-v4.sh
          done
      - name: Robinhood Chain - Robinhood Stock Token pools
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: |
          test -n "$(jq -r '.uniswapV4Adapter // empty' web/lib/deployments-4663.json)" || exit 0
          # stock tokens trade too little for the ranking above: their pools qualify by Robinhood's own token list,
          # depth and age instead (script/data/v4_stock_pools.py). A failed scan registers the last committed list.
          (cd contracts/script/data && python3 -I v4_stock_pools.py) || echo "::warning::stock pool scan failed; registering the last list"
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || exit 0
          cd contracts
          for A in $( (jq -r .uniswapV4Adapter ../web/lib/deployments-4663.json; jq -r '.uniswapV4AdapterV2 // empty' deployments/4663-fixes.json 2>/dev/null) | awk 'NF && !seen[tolower($0)]++'); do
            echo "adapter $A"
            RPC="$ROBINHOOD_RPC_URL" PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
              PROTECT="$(jq -r '.stoa // empty' ../web/lib/deployments-4663.json)" \
              PROTECT_PAIRS="0x0000000000000000000000000000000000000000-0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" \
              ADAPTER="$A" SEED=script/data/v4-stock-seed-4663.json ./script/seed-v4.sh
          done
      - name: Robinhood Chain - Metric pool lists
        if: ${{ hashFiles('contracts/deployments/4663-metric.json') != '' }}
        continue-on-error: true
        run: |
          (cd contracts/script/data && python3 -I metric_pools.py) || { echo "::warning::Metric ranking failed; lists unchanged"; exit 0; }
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || exit 0
          cd contracts && RPC="${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}" \
            PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
            ADAPTER="$(jq -r .metricAdapter deployments/4663-metric.json)" ./script/metric-set-pools.sh
      - name: List routable bridged tokens
        working-directory: contracts/script/data
        run: python3 -I bridged_tokens.py || echo "::warning::bridged token scan failed; keeping yesterday's list"
      - name: Save the lists
        run: |
          L="contracts/script/data/v4-seed-pools.json contracts/script/data/v4-seed-pools-4663.json contracts/script/data/v4-stock-seed-4663.json contracts/script/data/v4-stock-pools-keys-4663.json contracts/script/data/v4-pool-keys-4663.json contracts/script/data/metric-pools-4663.json web/lib/bridged-tokens.json"
          git diff --quiet $L && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
          git add $L
          git commit -m "data: refresh V4 pools and bridged tokens"
          # other workflows push to main too: rebase on top of them before pushing, a few times if needed
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
