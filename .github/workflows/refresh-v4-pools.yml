name: Refresh Uniswap V4 pools

# Daily: rank the most traded Uniswap V4 launchpad pools on Elysium and register the new ones on Stoa's V4 adapter,
# so fresh tokens route without anyone pressing "Add pool". Known pools and full pairs are skipped at no gas cost.
# Then lists the tokens from the canonical HyperEVM bridge that the router can trade both ways (web token picker).
on:
  schedule:
    - cron: "17 1 * * *" # 08:17 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write # "pair full" alerts (below)

concurrency:
  group: refresh-v4-pools
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ELYSIUM_RPC_URL: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
      FULL_LOG: /tmp/v4-pairs-full.txt # seed-v4.sh lists every pool it kept out of a full pair here
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Which V4 adapters are deployed
        # once UniswapV4AdapterV3 is deployed, the rankings also take pools on the three Fables hooks it allows (V2
        # refuses them at no gas cost)
        run: if [ -f contracts/deployments/4663-v4v3.json ]; then echo "FABLES=1" >> "$GITHUB_ENV"; fi
      - name: Rank active pools
        working-directory: contracts/script/data
        run: python3 -I v4_top_pools.py
      - name: Register new pools
        working-directory: contracts
        run: |
          ADAPTER="$(jq -r '.uniswapV4Adapter // empty' ../web/lib/deployments.json)"
          test -n "$ADAPTER" || { echo "no V4 adapter deployed"; exit 0; }
          test -n "${{ secrets.DEPLOYER_PRIVATE_KEY }}" || { echo "::warning::DEPLOYER_PRIVATE_KEY missing; skipping registration"; exit 0; }
          RPC="$ELYSIUM_RPC_URL" PRIVATE_KEY="${{ secrets.DEPLOYER_PRIVATE_KEY }}" ADAPTER="$ADAPTER" ./script/seed-v4.sh
      - name: Robinhood Chain - rank and register new pools
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: |
          test -n "$(jq -r '.uniswapV4Adapter // empty' web/lib/deployments-4663.json)" || { echo "not deployed on Robinhood Chain yet"; exit 0; }
          # the log scan needs the public RPC (keyed plans cap eth_getLogs); registration uses ROBINHOOD_RPC_URL
          # a failed scan (rate limits) still registers the last committed list
          (cd contracts/script/data && ROBINHOOD_RPC_URL=https://rpc.mainnet.chain.robinhood.com CHAIN=robinhood V4_FABLES="$FABLES" python3 -I v4_top_pools.py) \
            || echo "::warning::Robinhood Chain pool scan failed; registering the last list"
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || { echo "::warning::ROBINHOOD_DEPLOYER_PRIVATE_KEY missing; skipping registration"; exit 0; }
          # the router's V4 adapter, and UniswapV4AdapterV2 (keeper-only registration) until the timelock swaps them
          cd contracts
          for A in $( (jq -r .uniswapV4Adapter ../web/lib/deployments-4663.json; jq -r '.uniswapV4AdapterV2 // empty' deployments/4663-fixes.json 2>/dev/null; jq -r '.uniswapV4AdapterV3 // empty' deployments/4663-v4v3.json 2>/dev/null) | awk 'NF && !seen[tolower($0)]++'); do
            echo "adapter $A"
            # never evicts (full pairs are skipped) and never touches STOA pools or ETH/USDG, the pairs Stoa's own flows use
            # (GHSA-cv5f-wmmh-wcrv)
            RPC="$ROBINHOOD_RPC_URL" PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
              PROTECT="$(jq -r '.stoa // empty' ../web/lib/deployments-4663.json)" \
              PROTECT_PAIRS="0x0000000000000000000000000000000000000000-0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" \
              ADAPTER="$A" SEED=script/data/v4-seed-pools-4663.json ./script/seed-v4.sh
          done
      - name: Robinhood Chain - Robinhood Stock Token pools
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: |
          test -n "$(jq -r '.uniswapV4Adapter // empty' web/lib/deployments-4663.json)" || exit 0
          # stock tokens trade too little for the ranking above: their pools qualify by Robinhood's own token list,
          # depth and age instead (script/data/v4_stock_pools.py). A failed scan registers the last committed list.
          (cd contracts/script/data && V4_FABLES="$FABLES" python3 -I v4_stock_pools.py) || echo "::warning::stock pool scan failed; registering the last list"
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || exit 0
          cd contracts
          for A in $( (jq -r .uniswapV4Adapter ../web/lib/deployments-4663.json; jq -r '.uniswapV4AdapterV2 // empty' deployments/4663-fixes.json 2>/dev/null; jq -r '.uniswapV4AdapterV3 // empty' deployments/4663-v4v3.json 2>/dev/null) | awk 'NF && !seen[tolower($0)]++'); do
            echo "adapter $A"
            RPC="$ROBINHOOD_RPC_URL" PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
              PROTECT="$(jq -r '.stoa // empty' ../web/lib/deployments-4663.json)" \
              PROTECT_PAIRS="0x0000000000000000000000000000000000000000-0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" \
              ADAPTER="$A" SEED=script/data/v4-stock-seed-4663.json ./script/seed-v4.sh
          done
      - name: Robinhood Chain - copy UniswapV4AdapterV2's keys to UniswapV4AdapterV3
        # Only once deploy-robinhood-v4v3.yml committed contracts/deployments/4663-v4v3.json. At most 100 new keys a
        # run and 4 a pair; the STOA and ETH/USDG pairs are registered by hand and pinned by the timelock.
        if: ${{ hashFiles('contracts/deployments/4663-v4v3.json') != '' }}
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: |
          (cd contracts/script/data && ROBINHOOD_RPC_URL=https://rpc.mainnet.chain.robinhood.com python3 -I v4_v3_seed.py) \
            || echo "::warning::V3 seed list failed; registering the last list"
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || exit 0
          cd contracts
          RPC="$ROBINHOOD_RPC_URL" PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" MAX_NEW=100 \
            PROTECT="$(jq -r '.stoa // empty' ../web/lib/deployments-4663.json)" \
            PROTECT_PAIRS="0x0000000000000000000000000000000000000000-0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" \
            ADAPTER="$(jq -r .uniswapV4AdapterV3 deployments/4663-v4v3.json)" SEED=script/data/v4-v3-seed-4663.json ./script/seed-v4.sh
      - name: Robinhood Chain - Metric pool lists
        if: ${{ hashFiles('contracts/deployments/4663-metric.json') != '' }}
        continue-on-error: true
        run: |
          (cd contracts/script/data && python3 -I metric_pools.py) || { echo "::warning::Metric ranking failed; lists unchanged"; exit 0; }
          test -n "${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" || exit 0
          cd contracts && RPC="${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}" \
            PRIVATE_KEY="${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}" \
            ADAPTER="$(jq -r .metricAdapter deployments/4663-metric.json)" ./script/metric-set-pools.sh
      - name: List routable bridged tokens
        working-directory: contracts/script/data
        run: python3 -I bridged_tokens.py || echo "::warning::bridged token scan failed; keeping yesterday's list"
      - name: Robinhood Chain - gas report of the listed V4 keys
        # Every listed key's swap simulation, once, read-only (script/data/v4_gas_report.py). A key whose pool cannot
        # fill the trade walks the tick range and makes every quote and swap of its pair expensive (Hey Research Lab,
        # UniswapV4AdapterV3 review, L-1): list those keys in the run summary and in a GitHub issue (label v4-gas),
        # updated only when a key shows up that the last report did not list. Nothing is removed automatically.
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd contracts/script/data
          python3 -I v4_gas_report.py || { echo "::warning::V4 gas report failed"; exit 0; }
          cat v4-gas-report.md >> "$GITHUB_STEP_SUMMARY"
          heavy=$(jq -r '. as $r | [.keys[] | select(.gas == null or .gas > $r.heavy) | .key | "(\(.currency0),\(.currency1),\(.fee),\(.tickSpacing),\(.hooks))"] | unique | .[]' v4-gas-report.json)
          test -n "$heavy" || { echo "no heavy keys"; exit 0; }
          echo "::warning::$(echo "$heavy" | wc -l) V4 keys cost more than $(jq .heavy v4-gas-report.json) gas per simulation (see the summary)"
          body=$(printf '%s\n\nRun: %s' "$(cat v4-gas-report.md)" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          n=$(gh issue list --state open --label v4-gas --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh label create v4-gas --color FBCA04 2>/dev/null; gh issue create --title "Expensive V4 pool keys" --label v4-gas --body "$body"; exit 0; fi
          c=$(gh api "repos/${{ github.repository }}/issues/$n" --jq .comments)
          if [ "$c" -gt 0 ]; then last=$(gh api "repos/${{ github.repository }}/issues/$n/comments?per_page=100&page=$(( (c + 99) / 100 ))" --jq 'last | .body')
          else last=$(gh api "repos/${{ github.repository }}/issues/$n" --jq .body); fi
          new=$(echo "$heavy" | while read -r k; do echo "$last" | grep -qF "$k" || echo "$k"; done)
          test -n "$new" || { echo "no key the last report did not list"; exit 0; }
          gh issue comment "$n" --body "$body"
      - name: Alert on full pairs
        # A pool kept out of a full pair may be a pair's real pool held out by planted ones (Hey Research Lab,
        # UniswapV4AdapterV3 review, Low 2): open an issue (emails the repo owner), comment only when a pool shows up that the last report did not list.
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "$FULL_LOG" || { echo "no pool kept out of a full pair"; exit 0; }
          list=$(sort -u "$FULL_LOG")
          body=$(printf 'The daily V4 job kept these pools out because their pair already holds its maximum number of keys (adapter, then pool key). Check whether one of them is the pair'"'"'s real pool; if so, unregister a planted key (keeper) and register it by hand.\n\n```\n%s\n```\n\nRun: %s' "$list" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          n=$(gh issue list --state open --label v4-pairs --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh label create v4-pairs --color D93F0B 2>/dev/null; gh issue create --title "V4 pools kept out of full pairs" --label v4-pairs --body "$body"; exit 0; fi
          c=$(gh api "repos/${{ github.repository }}/issues/$n" --jq .comments)
          if [ "$c" -gt 0 ]; then last=$(gh api "repos/${{ github.repository }}/issues/$n/comments?per_page=100&page=$(( (c + 99) / 100 ))" --jq 'last | .body')
          else last=$(gh api "repos/${{ github.repository }}/issues/$n" --jq .body); fi
          echo "$last" >"$RUNNER_TEMP/last.txt"
          new=$(echo "$list" | grep -vxF -f "$RUNNER_TEMP/last.txt")
          test -n "$new" || { echo "no pool the last report did not list"; exit 0; }
          gh issue comment "$n" --body "$body"
      - name: Save the lists
        run: |
          L="contracts/script/data/v4-seed-pools.json contracts/script/data/v4-seed-pools-4663.json contracts/script/data/v4-stock-seed-4663.json contracts/script/data/v4-stock-pools-keys-4663.json contracts/script/data/v4-pool-keys-4663.json contracts/script/data/metric-pools-4663.json contracts/script/data/v4-v3-seed-4663.json web/lib/bridged-tokens.json"
          git diff --quiet $L && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
          git add $L
          git commit -m "data: refresh V4 pools and bridged tokens"
          # other workflows push to main too: rebase on top of them before pushing, a few times if needed
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
