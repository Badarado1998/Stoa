name: Telegram gap alerts

# Every 15 minutes: posts Robinhood Stock Tokens whose on-chain price is 1.5% or more away from Robinhood's price to the
# Stoa Gap Alerts Telegram channel (data/alerts/tg_gaps.py). Needs the TELEGRAM_BOT_TOKEN secret; the channel comes from
# the TELEGRAM_GAP_CHAT variable (default @StoaGaps). Without the token this does nothing.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send one test message to the channel"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-gaps
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HAS_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - name: Skip without the token
        if: env.HAS_TOKEN != 'true'
        run: echo "TELEGRAM_BOT_TOKEN is not set; nothing posted."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          sparse-checkout: data/alerts
          persist-credentials: false
      - name: Restore last alerts
        if: env.HAS_TOKEN == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tg_state.json
          key: tg-gaps-${{ github.run_id }}
          restore-keys: tg-gaps-
      - name: Test message
        if: env.HAS_TOKEN == 'true' && inputs.test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_GAP_CHAT || '@StoaGaps' }}
        run: python3 -I data/alerts/tg_gaps.py --test
      - name: Post new gaps
        if: env.HAS_TOKEN == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_GAP_CHAT || '@StoaGaps' }}
        run: python3 -I data/alerts/tg_gaps.py tg_state.json
      - name: Save alerts
        if: env.HAS_TOKEN == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: tg_state.json
          key: tg-gaps-${{ github.run_id }}
