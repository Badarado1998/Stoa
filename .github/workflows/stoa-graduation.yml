name: Pons graduation watcher ($STOA and every other launch)

# Every 10 minutes (GitHub runs it about every 40): when $STOA, or any other Pons launch, graduates from its bonding
# curve to a Uniswap V4 pool on Robinhood Chain, register that pool on Stoa's V4 adapter so the token routes on
# stoadex.com right away. Does nothing for pools already registered. Gas from ROBINHOOD_DEPLOYER_PRIVATE_KEY
# (about 0.000005 ETH per pool).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Blocks to look back for other Pons graduations (default 1000000, about 30h)"
        required: false
        default: "1000000"
      max:
        description: "Most pools to register in this run (default 10; raise it for a backfill)"
        required: false
        default: "10"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Register $STOA's V4 pool once it exists (creating it first if the curve graduated without one)
        working-directory: contracts
        env:
          RPC: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
          PRIVATE_KEY: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
        run: ./script/stoa-graduation.sh

      - name: Register the pools of other recently graduated Pons tokens
        working-directory: contracts
        env:
          RPC: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
          PRIVATE_KEY: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
        # log scans need the public RPC's 10M-block range, so this step always reads from it
        run: RPC=https://rpc.mainnet.chain.robinhood.com WINDOW=${{ inputs.window || '1000000' }} MAX=${{ inputs.max || '10' }} ./script/pons-graduations.sh
