name: Elysium governance steps (gas-capped adapters)

# Hourly once deploy-elysium-simgas.yml has committed contracts/deployments/99901-simgas.json; before that it turns
# itself off (the deploy workflow turns it back on). Each run moves the swap one step forward if due
# (script/RolloutSimGasElysium.s.sol): 1) schedule in the 48h timelock, 2) propose on the router, 3) add the
# gas-capped V3, Aero and Ramses adapters and UniswapV4AdapterV3, and remove the old four in the same transaction (only
# once every copied V4 pair has a key on V4AdapterV3). When done it points the app and the docs at the new adapters
# (contracts/script/data/elysium_swap_addresses.py: web/lib/deployments.json, contracts/deployments/99901.json and the
# Elysium table in contracts.md), commits that, and disables itself.
# To stop the rollout midway: disable this workflow first, then cancel from the Safe (a cancelled operation reads as
# not scheduled, and the next hourly run would schedule it again).
# The signer keys reach only the steps that sign; the commit and the switch-off run in a second job that holds no secret.
# Signs as two Safe signers from OWNER_PRIVATE_KEY (0x5A63...03c9) and DEPLOYER_PRIVATE_KEY (0x0568...c500). With only
# one of them set it approves and the other signer can press the same step on stoadex.com/admin (Elysium).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: rollout-elysium-simgas
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    environment: signers # the Safe signer keys live here, usable from main only
    permissions:
      contents: read
      actions: write # only to switch the hourly runs off before the deploy
    outputs:
      done: ${{ steps.next.outputs.done }}
    defaults:
      run:
        working-directory: contracts
    env:
      RPC: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1

      - name: Not deployed yet? Then stop the hourly runs
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f deployments/99901-simgas.json ]; then
            echo "Not deployed yet (run deploy-elysium-simgas.yml). Turning the hourly runs off." | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow disable rollout-elysium-simgas.yml -R "$GITHUB_REPOSITORY"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      # Before every run until the swap is done: rebuild the seed from the keeper's own registrations (keys added since
      # the deploy included), then register what V4AdapterV3 lacks, so step 3's check reads a current, complete seed.
      # Either failing does not stop this run's step 1 or 2; it only holds step 3 (SEED_FRESH=false) until a run where
      # both work. The keeper key is given to the copy alone.
      - name: Rebuild the seed from the keeper's registrations
        id: rebuild
        if: ${{ steps.pre.outputs.skip != '1' }}
        continue-on-error: true
        run: |
          [ "$(cast call 0x104752d50ef893da579ad813918269e09ea17dba 'isAdapter(address)(bool)' 0xeb4bec2795ce314d1add4f8b3f2fcfbf38e892e5 --rpc-url "$RPC")" = "true" ] \
            || { echo "The old V4 adapter is out of the router: nothing to keep current."; exit 0; }
          cd script/data && ELYSIUM_RPC_URL="$RPC" python3 -I v4_copy_keys_elysium.py

      - name: Register what V4AdapterV3 lacks (keeper)
        id: copy
        if: ${{ steps.pre.outputs.skip != '1' && steps.rebuild.outcome == 'success' }}
        continue-on-error: true
        env:
          K2: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          [ "$(cast call 0x104752d50ef893da579ad813918269e09ea17dba 'isAdapter(address)(bool)' 0xeb4bec2795ce314d1add4f8b3f2fcfbf38e892e5 --rpc-url "$RPC")" = "true" ] || exit 0
          [ -n "$K2" ] || { echo "::warning::No keeper key (DEPLOYER_PRIVATE_KEY): V4AdapterV3's keys were not refreshed."; exit 1; }
          RPC="$RPC" PRIVATE_KEY="0x${K2#0x}" ADAPTER="$(jq -r .uniswapV4AdapterV3 deployments/99901-simgas.json)" \
            SEED=script/data/v4-v3-seed-99901.json STRICT=1 ./script/seed-v4.sh

      - name: Next step (if due)
        id: next
        if: ${{ steps.pre.outputs.skip != '1' }}
        env:
          K1: ${{ secrets.OWNER_PRIVATE_KEY }}
          K2: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEED_FRESH: ${{ (steps.rebuild.outcome == 'success' && steps.copy.outcome == 'success') && 'true' || 'false' }}
        run: |
          set -o pipefail
          [ "$(cast chain-id --rpc-url "$RPC")" = "99901" ] || { echo "::error::RPC is not Elysium"; exit 1; }
          [ -n "$K1" ] && export SIGNER1_PK="0x${K1#0x}"
          [ -n "$K2" ] && export SIGNER2_PK="0x${K2#0x}"
          if [ -z "$K1$K2" ]; then echo "::notice::No signer key: add OWNER_PRIVATE_KEY and DEPLOYER_PRIVATE_KEY."; exit 0; fi
          forge script script/RolloutSimGasElysium.s.sol --rpc-url "$RPC" --broadcast --slow 2>&1 | tee /tmp/out.txt
          grep -E "WAIT|APPROVED|EXECUTED|DONE" /tmp/out.txt | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q "DONE:" /tmp/out.txt; then
            echo "Done on Elysium." >> "$GITHUB_STEP_SUMMARY"
            echo "done=1" >> "$GITHUB_OUTPUT"
          fi

  # No secret in this job: it only rewrites three files from the committed 99901-simgas.json, commits them, and stops
  # the hourly runs. Runs only once the step above printed DONE (derived from the router on chain).
  point:
    needs: step
    if: ${{ needs.step.outputs.done == '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point the app and the docs at the new adapters, then stop the hourly runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I contracts/script/data/elysium_swap_addresses.py "$(date -u +%F)"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_AUTHOR_NAME="StoaDex" GIT_AUTHOR_EMAIL="355140148+StoaDex@users.noreply.github.com"
            git add web/lib/deployments.json contracts/deployments/99901.json web/content/docs/contracts.md
            git commit -m "Elysium: the router uses the gas-capped V3, Aero and Ramses adapters and UniswapV4AdapterV3"
            ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep $((i * 10)); done
            [ "$ok" = 1 ] || exit 1
          fi
          gh workflow disable rollout-elysium-simgas.yml -R "$GITHUB_REPOSITORY"
