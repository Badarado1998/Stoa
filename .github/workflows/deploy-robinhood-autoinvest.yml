name: Deploy StoaAutoInvest (Robinhood Chain)

# Manual only. Unticked "broadcast" = dry run against Robinhood Chain mainnet: sends nothing.
# Deploys StoaAutoInvest (recurring buys: funds stay in the owner's wallet, each buy pulls one amount and swaps it
# through the live router to the owner; Stoa's keeper runs the due buys). No owner, no settings; nothing in governance changes.
# Verifies it on Sourcify. Run only after the independent review and the owner's go-ahead.
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Send the transaction (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-robinhood
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      PK: ${{ secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check settings
        run: |
          test -n "$PK" || { echo "::error::secret ROBINHOOD_DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          [ "$(cast chain-id --rpc-url "$ROBINHOOD_RPC_URL")" = "4663" ] || { echo "::error::RPC is not Robinhood Chain mainnet"; exit 1; }
          echo "Deployer: $(cast wallet address --private-key "$PK") · $(cast balance $(cast wallet address --private-key "$PK") --ether --rpc-url "$ROBINHOOD_RPC_URL") ETH"

      - name: Fork test - a weekly USDG to stock token plan through the live router, runner, minimum and cancel rules
        run: forge test --match-contract ForkRobinhoodCrossBuy -vv

      - name: Deploy (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        run: |
          forge script script/DeployStoaAutoInvest.s.sol --rpc-url "$ROBINHOOD_RPC_URL" --private-key "$PK" \
            --slow ${{ inputs.broadcast && '--broadcast' || '' }}
          cat deployments/4663-autoinvest.json

      - name: Verify on Sourcify
        if: ${{ inputs.broadcast }}
        continue-on-error: true
        run: |
          M=$(jq -r .autoInvest deployments/4663-autoinvest.json)
          forge verify-contract $M src/tools/StoaAutoInvest.sol:StoaAutoInvest --verifier sourcify --chain 4663 \
            --constructor-args $(cast abi-encode "c(address)" 0x2F2804fad735a38015650f32f95Ad5E08D6B3eE5) || true

      - name: Check the deployed contract
        if: ${{ inputs.broadcast }}
        run: |
          M=$(jq -r .autoInvest deployments/4663-autoinvest.json)
          echo "router $(cast call $M 'router()(address)' --rpc-url "$ROBINHOOD_RPC_URL")"
          echo "::notice::StoaAutoInvest deployed at $M"
