name: Smoke swap

# Manual production check: swap a small amount of HYPE to USDC through the live router, then swap the USDC back,
# from the deployer wallet. Proves the native path and the ERC-20 (approve) path work end to end on mainnet.
on:
  workflow_dispatch:
    inputs:
      hype:
        description: "HYPE to swap (ether units)"
        default: "0.01"

permissions:
  contents: read

jobs:
  swap:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz' }}
      PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      USDC: "0xb47c4C8F73F009CC0C0d3f92B388d13E293F0B65"
      NATIVE: "0x0000000000000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Swap HYPE -> USDC -> HYPE
        run: |
          set -euo pipefail
          test -n "$PK" || { echo "DEPLOYER_PRIVATE_KEY missing"; exit 1; }
          ROUTER=$(jq -r .router web/lib/deployments.json)
          ME=$(cast wallet address --private-key "$PK")
          QT='quote(address,address,uint256)((uint256,address,(address,bool),(address,bool)))'
          SW='swap((address,address,address,(address,bool),(address,bool),uint256,uint256,address,uint256,address))'
          # quote -> "(out, mid, (v1, p1), (v2, p2))" -> swap tuple with 1% slippage
          params() {
            local tin=$1 tout=$2 amt=$3
            local q; q=$(cast call $ROUTER "$QT" $tin $tout $amt --rpc-url $RPC | sed -E 's/ \[[^]]*\]//g')
            python3 - "$q" "$tin" "$tout" "$amt" "$ME" <<'PY'
          import re, sys, time
          q, tin, tout, amt, me = sys.argv[1:]
          a = re.findall(r'0x[0-9a-fA-F]{40}|true|false|\d+', q)
          out, mid, v1, p1, v2, p2 = a[:6]
          assert int(out) > 0, "no route"
          print(f"({tin},{tout},{mid},({v1},{p1}),({v2},{p2}),{amt},{int(out)*99//100},{me},{int(time.time())+600},0x0000000000000000000000000000000000000000)")
          PY
          }
          AMT=$(cast to-wei "${{ inputs.hype }}")
          B0=$(cast balance $ME --rpc-url $RPC)
          P=$(params $NATIVE $USDC $AMT); echo "HYPE -> USDC: $P"
          cast send $ROUTER "$SW" "$P" --value $AMT --private-key "$PK" --rpc-url $RPC | grep -E "status|transactionHash"
          GOT=$(cast call $USDC 'balanceOf(address)(uint256)' $ME --rpc-url $RPC | cut -d' ' -f1)
          echo "USDC now: $GOT"
          cast send $USDC 'approve(address,uint256)' $ROUTER $GOT --private-key "$PK" --rpc-url $RPC | grep -E "status"
          P=$(params $USDC $NATIVE $GOT); echo "USDC -> HYPE: $P"
          cast send $ROUTER "$SW" "$P" --private-key "$PK" --rpc-url $RPC | grep -E "status|transactionHash"
          B1=$(cast balance $ME --rpc-url $RPC)
          echo "HYPE before $(cast from-wei $B0), after $(cast from-wei $B1)"
