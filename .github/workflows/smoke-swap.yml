name: Smoke swap

# Manual production check: swap a small amount of the native coin to the stablecoin through the live router, then
# swap it back, from the network's deployer wallet. Proves the native path and the ERC-20 (approve) path work end to
# end on mainnet. Elysium: HYPE <-> USDC (DEPLOYER_PRIVATE_KEY). Robinhood Chain: ETH <-> USDG
# (ROBINHOOD_DEPLOYER_PRIVATE_KEY).
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        type: choice
        options: [elysium, robinhood]
        default: elysium
      hype:
        description: "Native coin to swap (ether units: HYPE on Elysium, ETH on Robinhood)"
        default: "0.01"

permissions:
  contents: read

jobs:
  swap:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ inputs.network == 'robinhood' && (secrets.ROBINHOOD_FORK_RPC_URL || secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com') || (secrets.ELYSIUM_RPC_URL || 'https://rpc.elysium.kinetiq.xyz') }}
      PK: ${{ inputs.network == 'robinhood' && secrets.ROBINHOOD_DEPLOYER_PRIVATE_KEY || secrets.DEPLOYER_PRIVATE_KEY }}
      USDC: ${{ inputs.network == 'robinhood' && '0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168' || '0xb47c4C8F73F009CC0C0d3f92B388d13E293F0B65' }}
      DEPLOYMENTS: ${{ inputs.network == 'robinhood' && 'web/lib/deployments-4663.json' || 'web/lib/deployments.json' }}
      NATIVE: "0x0000000000000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Swap native -> stable -> native (${{ inputs.network }})
        run: |
          set -euo pipefail
          test -n "$PK" || { echo "deployer key missing for ${{ inputs.network }}"; exit 1; }
          ROUTER=$(jq -r .router $DEPLOYMENTS)
          ME=$(cast wallet address --private-key "$PK")
          QT='quote(address,address,uint256)((uint256,address,(address,bool),(address,bool)))'
          SW='swap((address,address,address,(address,bool),(address,bool),uint256,uint256,address,uint256,address))'
          # quote -> "(out, mid, (v1, p1), (v2, p2))" -> swap tuple with 1% slippage
          params() {
            local tin=$1 tout=$2 amt=$3
            local q; q=$(cast call $ROUTER "$QT" $tin $tout $amt --rpc-url $RPC | sed -E 's/ \[[^]]*\]//g')
            python3 - "$q" "$tin" "$tout" "$amt" "$ME" <<'PY'
          import re, sys, time
          q, tin, tout, amt, me = sys.argv[1:]
          a = re.findall(r'0x[0-9a-fA-F]{40}|true|false|\d+', q)
          out, mid, v1, p1, v2, p2 = a[:6]
          assert int(out) > 0, "no route"
          print(f"({tin},{tout},{mid},({v1},{p1}),({v2},{p2}),{amt},{int(out)*99//100},{me},{int(time.time())+600},0x0000000000000000000000000000000000000000)")
          PY
          }
          AMT=$(cast to-wei "${{ inputs.hype }}")
          B0=$(cast balance $ME --rpc-url $RPC)
          P=$(params $NATIVE $USDC $AMT); echo "native -> stable: $P"
          # the estimate is the bare minimum (adapters simulate inside try/catch): send with 30% + 50k headroom, as the app does
          G=$(cast estimate $ROUTER "$SW" "$P" --value $AMT --from $ME --rpc-url $RPC); G=$((G * 13 / 10 + 50000))
          cast send $ROUTER "$SW" "$P" --value $AMT --gas-limit $G --private-key "$PK" --rpc-url $RPC | grep -E "status|transactionHash|gasUsed"
          GOT=$(cast call $USDC 'balanceOf(address)(uint256)' $ME --rpc-url $RPC | cut -d' ' -f1)
          echo "stable now: $GOT"
          cast send $USDC 'approve(address,uint256)' $ROUTER $GOT --private-key "$PK" --rpc-url $RPC | grep -E "status"
          P=$(params $USDC $NATIVE $GOT); echo "stable -> native: $P"
          G=$(cast estimate $ROUTER "$SW" "$P" --from $ME --rpc-url $RPC); G=$((G * 13 / 10 + 50000))
          cast send $ROUTER "$SW" "$P" --gas-limit $G --private-key "$PK" --rpc-url $RPC | grep -E "status|transactionHash|gasUsed"
          B1=$(cast balance $ME --rpc-url $RPC)
          echo "native before $(cast from-wei $B0), after $(cast from-wei $B1)"
