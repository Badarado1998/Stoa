name: V4 adapter guard (Robinhood Chain)
# Every 15 minutes. Fails (and GitHub emails the repository owner) if:
# - while the router still lists Stoa's first Uniswap V4 adapter, anyone but the keeper registered or replaced a key on
#   it since the checkpoint (the web app, the API and the keeper scripts already avoid such pairs);
# - UniswapV4AdapterV2 emitted an Unregistered event not listed in contracts/script/data/v4v2-reviewed.json;
# - the canonical $STOA pool is no longer among keysFor(WETH, STOA) on V2 (or on the first adapter while listed).
# (GHSA-cv5f-wmmh-wcrv and its re-test by Hey Research Lab.)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the V4 adapters
        working-directory: contracts/script
        env:
          ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
        run: |
          python3 -I v4_guard.py --fail || {
            echo "::error::V4 adapter check failed (see the JSON above): an outsider changed keys on the first adapter, V2 removed a key nobody reviewed, or the canonical STOA pool is missing; consider StoaRouter.pause (guardian) and re-register the pool by hand"
            exit 1; }
